name: Construir APK

# Se ejecuta a mano (Actions → Construir APK → Run workflow). No publica nada: deja el APK como archivo descargable.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Permisos de la app (notificaciones y cámara)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Notificaciones (Android 13+) y CÁMARA: sin el permiso de cámara declarado, el WebView ignora
          # capture="environment" y el botón "Tomar foto" abre el selector de archivos.
          for permiso in POST_NOTIFICATIONS CAMERA; do
            grep -q "android.permission.$permiso" "$MANIFEST" || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$permiso\" />\n</manifest>#" "$MANIFEST"
          done
          grep -q "android.hardware.camera" "$MANIFEST" || sed -i 's#</manifest>#    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$MANIFEST"
          cat "$MANIFEST"

      - name: Iconos de la app
        run: npx @capacitor/assets generate --android --assetPath assets || echo "::warning::No se generaron los iconos; la APK usará el icono por defecto"

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: apk/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Comprobar permisos dentro de la APK
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump permissions android/app/build/outputs/apk/debug/app-debug.apk | tee permisos.txt
          grep -q "android.permission.CAMERA" permisos.txt || { echo "::error::La APK no declara el permiso de la cámara"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: electricos-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
